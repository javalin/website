# Tears down a PR's preview when it closes. Building and deploying previews lives in
# pr-preview-build.yml / pr-preview-deploy.yml. This job never checks out PR code,
# which is what keeps pull_request_target safe here.
name: PR Preview Teardown
run-name: Tear down preview of pr ${{ github.event.pull_request.number }}

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write # Required to add a comment to the PR

jobs:
  Teardown:
    runs-on: ubuntu-24.04
    steps:
      - name: Install surge
        run: npm install -g surge

      - name: Tear down surge
        run: surge teardown javalin-pr-${{ github.event.pull_request.number }}-preview.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Update comment to Preview Deleted
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### 🗑 Deploy Preview for javalin.io deleted.
            | Name | Link |
            |-|-|
            | 🔨 Latest commit | ${{ github.event.pull_request.head.sha }} |
            | 🔍 Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
      
      - if: ${{ failure() }}
        name: Update comment to Preview Delete Failed
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### ❌ Delete Preview for javalin.io failed.
            | Name | Link |
            |-|-|
            | 🔨 Latest commit | ${{ github.event.pull_request.head.sha }} |
            | 🔍 Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |      


